name: build AND docker latest push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: ./mvnw clean package -Dmaven.test.skip=true
      - name: Copy jar to docker/rootfs
        run: cp target/distops-*.jar docker/rootfs/distops.jar

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"

      - name: Build local test image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/distops:test ./docker

      - name: Install test tools (regctl, skopeo, podman)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo podman
          curl -sL https://github.com/regclient/regclient/releases/download/v0.11.1/regctl-linux-amd64 -o /tmp/regctl
          chmod +x /tmp/regctl && sudo mv /tmp/regctl /usr/local/bin/regctl

      - name: Setup crictl
        run: |
          CRICTL_VER="v1.35.0"
          curl -sL "https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRICTL_VER}/crictl-${CRICTL_VER}-linux-amd64.tar.gz" | sudo tar -C /usr/local/bin -xz
          sudo crictl --version || echo "crictl install skipped"

      - name: Setup docker insecure registries
        run: |
          sudo mkdir -p /etc/docker
          echo "{}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 3

      - name: Integration test (Mode 1 - Direct)
        run: |
          SKIP=test_containerd,test_crictl IMAGE=${{ secrets.DOCKER_USERNAME }}/distops:test python3 scripts/tests/run.py

      - name: Integration test (Mode 2 - Proxy via nginx)
        run: |
          SKIP=test_containerd,test_crictl IMAGE=${{ secrets.DOCKER_USERNAME }}/distops:test NO_PROXY="localhost,127.0.0.1,192.168.0.0/16,.local,.internal" python3 scripts/tests/run.py --nginx

      - name: Docker logs (debug)
        if: always()
        run: |
          echo "=== distops-test logs ==="
          docker logs distops-test 2>&1 | tail -80
          echo "=== docker ps ==="
          docker ps -a --format "table {{.Names}}	{{.Status}}	{{.Ports}}"

      - name: Build docker image (local, no push)
        run: |
          ./buildx.sh --push false --repo ${{ secrets.DOCKER_USERNAME }} --image-name distops

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker image (with push)
        run: |
          ./buildx.sh --push true --repo ${{ secrets.DOCKER_USERNAME }} --image-name distops
